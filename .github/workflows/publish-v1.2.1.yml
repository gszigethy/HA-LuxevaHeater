name: Publish v1.2.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.2.1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify manifest version
        run: |
          python - <<'PY'
          import json
          with open("custom_components/luxeva_heater/manifest.json", encoding="utf-8") as f:
              assert json.load(f)["version"] == "1.2.1"
          PY
      - name: Build integration ZIP
        run: |
          cd custom_components
          zip -r ../luxeva_heater.zip luxeva_heater -x "*/__pycache__/*" "*.pyc"
          test -s ../luxeva_heater.zip
      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v1.2.1
          name: Luxeva Heater v1.2.1
          target_commitish: main
          generate_release_notes: true
          prerelease: false
          files: luxeva_heater.zip
