name: Correct v1.2.1 release title

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/correct-v1.2.1-title.yml"

permissions:
  contents: write

jobs:
  correct-title:
    runs-on: ubuntu-latest
    steps:
      - name: Rename existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit v1.2.1 --title "v1.2.1 HACS publication readiness"
          test "$(gh release view v1.2.1 --json name --jq .name)" = "v1.2.1 HACS publication readiness"
