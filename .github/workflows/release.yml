name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test and analysis dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Validate tag and manifest version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          with open("custom_components/luxeva_heater/manifest.json", encoding="utf-8") as file:
              print(json.load(file)["version"])
          PY
          )"
          EXPECTED_TAG="v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${EXPECTED_TAG}"
            exit 1
          fi

      - name: Require release commit to be on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "::error::Release tag must point to a commit contained in main"
            exit 1
          fi

      - name: Ruff
        run: ruff check --select E4,E7,E9,F,B custom_components tests

      - name: Mypy
        run: |
          mypy custom_components/luxeva_heater             --ignore-missing-imports             --follow-imports skip

      - name: Unit tests
        run: |
          pytest tests/ -v             --cov=custom_components/luxeva_heater             --cov-branch             --cov-report=term-missing             --cov-fail-under=70

      - name: Home Assistant Hassfest
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          ignore: "license description topics"
          comment: false

      - name: Build integration ZIP
        shell: bash
        run: |
          cd custom_components
          zip -r ../luxeva_heater.zip luxeva_heater             -x "*/__pycache__/*" "*.pyc"
          test -s ../luxeva_heater.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: "Luxeva Heater ${{ github.ref_name }}"
          generate_release_notes: true
          files: luxeva_heater.zip
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'pre') }}
